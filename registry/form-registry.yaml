# Prism form registry（Lake D2 · FP-PRISM-007）
# 新增形态只改 registry + form contract + 路由表，不动主链与导演骨架。

schema_version: "1"
feature: prism-form-blog-thread-v1
lake: D2
extends: contracts/writing.contract.md
qa_gate: skills/prism-qa/references/anti-slop-gate.md

forms:
  - form: blog
    contract: contracts/form-blog.contract.md
    lane: standard
    producer_chain: writing.contract 四段式 → bridge humanizer 族 → anti-slop-gate
    fast_lane_skip_allowed: false
    status: registered
  - form: thread
    contract: contracts/form-thread.contract.md
    lane: fast|standard
    producer_chain: writing.contract 倒金字塔 → bridge writing-agent → anti-slop-gate
    fast_lane_skip_allowed: true
    canon_fast_skip_forbidden: true
    status: registered
  - form: image-post
    contract: contracts/form-image-post.contract.md
    lane: standard
    producer_chain: director shot list → form-image-post.contract（四分离）→ render bridge → OCR/QA 门
    fast_lane_skip_allowed: false
    status: registered
  - form: xhs
    contract: contracts/form-xhs.contract.md
    lane: standard
    producer_chain: writing.contract → bridge xhs-article-to-images → OCR 门
    fast_lane_skip_allowed: false
    status: registered
  - form: novel
    contract: contracts/form-novel.contract.md
    lane: canon|standard
    producer_chain: StoryMaster → director episode outline → form-novel.contract → canon_gate_status=passed → QA → release
    fast_lane_skip_allowed: false
    canon_fast_skip_forbidden: true
    status: registered
  - form: comic
    contract: contracts/form-av.contract.md
    lane: standard
    producer_chain: director storyboard → bridge comic-storyboard（3:4 竖版）→ QA
    fast_lane_skip_allowed: false
    status: registered
  - form: vlog
    contract: contracts/form-av.contract.md
    lane: standard
    producer_chain: director 口播脚本/分镜 → bridge openmontage → 成片 QA
    fast_lane_skip_allowed: false
    status: registered
  - form: book_video
    contract: contracts/form-av.contract.md
    lane: standard
    producer_chain: director 书籍分镜 → bridge book-video / rnskill → QA
    fast_lane_skip_allowed: false
    status: registered
  - form: manga_drama
    contract: contracts/form-manga-drama.contract.md
    lane: standard
    producer_chain: StoryMaster → director 分镜 JSON（storyboard-schema 校验）→ Seedance 参考链 / FFmpeg kenburns 降级 → 五类 QA 门 → release 停 pending_human
    fast_lane_skip_allowed: false
    status: registered   # 2026-08-21 human 指令转正；源 truth R1 已冻结+QA pass，CLI 已 A4 pin（sot-layering-decision D4）
  - form: live_drama
    contract: contracts/form-live-drama.contract.md
    lane: standard
    producer_chain: StoryMaster/剧集 bible → director 分集剧本+分镜 → 人工实拍素材 ingest → openmontage 剪辑 → 合规门（三类自审/AI 标识/授权）→ release 停人工
    fast_lane_skip_allowed: false
    status: registered   # 2026-08-21 human 冻结转正（truth R1）；持《广播电视节目制作经营许可证》已确认
  - form: product
    contract: contracts/form-product.contract.md
    lane: standard
    producer_chain: master 商品事实核对（规格/价格有源）→ director 卖点排序+shot list → form-product.contract（卖点结构）→ bridge 渲染/rnskill → 极限词门（广告法）+ OCR QA → release 停人工
    fast_lane_skip_allowed: false
    status: registered   # 2026-08-26 prism-form-product-v1；商品事实门+极限词门 fail-closed

guards:
  new_form_only_registry_contract_routing: true
  canon_lane_disables_fast_lane_skip: true
  missing_bridge_blocks_production: true
  account_hardcodes_forbidden: true
