schema_id: storyworld
schema_version: "1"
entity: StoryWorld
path_pattern: content/storyworlds/{world_slug}/
description: Canonical world bundle for bible, canon ledger, characters, scenes, props, and timeline.
required_files:
  - world.yaml
  - bible.md
  - canon-ledger.yaml
  - characters/
  - timeline/
optional_files:
  - episodes/
  - scenes/
  - props/
imports:
  field: imports
  element_fields:
    - from
    - asset
    - track
    - revision
  default_track: latest
  resolved_field: resolved_revision
  requires_source_frozen: true
required_fields:
  world.yaml:
    - world_slug
    - title
    - canon_policy
    - default_lane
  canon-ledger.yaml:
    - entries
guards:
  default_lane_must_be_canon_or_standard: true
  canon_policy_fail_closed: true
