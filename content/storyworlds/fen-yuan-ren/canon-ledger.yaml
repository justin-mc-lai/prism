entries:
  - id: fyr-rule-001
    rule: >
      本世界与《美利坚：烧尸人》仅共享"焚烧尸体获得词条能力"的题材骨架，
      人物、系统名、词条名、章节文本均为原创，禁止沿用原作专有名词与段落。
  - id: fyr-rule-002
    rule: >
      所有案件只做虚构化改编：受害者与凶手使用虚构姓名，案发地与时间可虚构；
      真实案件信息仅作为背景考据进入母稿素材表，不逐字复制报道原文。
  - id: fyr-rule-003
    rule: >
      残愿只来自"未偿之冤"，诡异是残愿凝结的产物；焚尸是见证与超度，
      叙事不美化凶手，不消费受害者痛苦。
  - id: fyr-rule-004
    rule: >
      埋点必须登记于母稿埋点表，回收前不得新增矛盾设定；未回收埋点禁止解释为巧合。
  - id: fyr-rule-005
    rule: >
      展示变体不得新增正典；bible 与 canon ledger 高于任何章节正文。
  - id: fyr-rule-006
    rule: >
      账本口径：世界中的"怨"称残愿/滞愿，浓度称滞留度；焚烧后提纯入账的数值统一称薪火值（系统账本）/净化值（档案局官方口径），二者同值同源；全书不再使用"怨念值"。
  - id: fyr-rule-007
    rule: >
      战力唯一锚点：1-10 阶、词条槽 2-11、体温 32.4-29.0℃、累计薪火阈值、每阶解锁（3 阶怨案回廊/6 阶词条融合/9 阶炉中界）以 power-ladder.md v1.0 为准；任何越阶胜利必须登记代价，越两阶击杀视为崩坏。
  - id: fyr-rule-008
    rule: >
      全员同梯：联邦焚尸场、档案局、守灵人等所有对抗诡异的角色与主角共用同一阶位、薪火消耗与体温代价体系；白鸽只作转折信号不加战力，档案局只登记不代打。
